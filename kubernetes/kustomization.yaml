apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iris
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Change this mapping to an image reachable by every amd64 cluster node.
images:
  - name: iris
    newName: iris
    newTag: docker-alpha
