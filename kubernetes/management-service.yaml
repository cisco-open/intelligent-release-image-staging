apiVersion: v1
kind: Service
metadata:
  name: iris-server-api
  labels:
    app.kubernetes.io/name: iris-server-api
    app.kubernetes.io/component: management-api
    app.kubernetes.io/part-of: iris
spec:
  # This service is deliberately cluster-internal. Devices and operators use
  # the two LoadBalancers; only the console may reach this endpoint.
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  selector:
    app.kubernetes.io/name: iris-seed-server
    app.kubernetes.io/component: server
  ports:
    - name: management-api
      port: 9443
      targetPort: management-api
      protocol: TCP
