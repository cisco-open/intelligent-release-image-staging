apiVersion: v1
kind: Service
metadata:
  name: iris-seed-server
  labels:
    app.kubernetes.io/name: iris-seed-server
    app.kubernetes.io/part-of: iris
spec:
  type: LoadBalancer
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  # The tracker records the socket source address when a peer does not announce
  # an explicit IP. Preserving it is required for peer-to-peer reachability.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: iris-seed-server
  ports:
    - name: tracker
      port: 6969
      targetPort: tracker
      protocol: TCP
    - name: catalog
      port: 8443
      targetPort: catalog
      protocol: TCP
    - name: artifacts
      port: 8000
      targetPort: artifacts
      protocol: TCP
    - name: bittorrent
      port: 6881
      targetPort: bittorrent
      protocol: TCP
    - name: console
      port: 8080
      targetPort: console
      protocol: TCP
    - name: health
      port: 9101
      targetPort: health
      protocol: TCP
