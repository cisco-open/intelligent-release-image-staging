descriptor-schema-version: "2.8"

info:
  name: iris
  description: "intelligent-release-image-staging (IRIS) torrent-swarm image agent (x86_64 IOx Docker app) for Catalyst 9000"
  version: "1.0"
  author-name: "IRIS"
  author-link: "http://localhost"

app:
  type: docker
  cpuarch: x86_64
  resources:
    profile: custom
    cpu: 400
    memory: 768
    disk: 2048
    network:
      - interface-name: eth0
  startup:
    rootfs: rootfs.tar
    target: ["/entrypoint.sh"]
