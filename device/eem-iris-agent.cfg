!
! Reference applet — matches what device-install.sh actually installs.
! authorization bypass is required: on AAA/TACACS-managed nodes the
! applet's cli commands silently no-op without it.
! bootstrap.sh (action 200) unpacks any newly dropped bundle.tgz,
! keeps aria2c up, trims aria2c.log, then runs iris_agent.py --once.
event manager applet IRIS-AGENT authorization bypass
 event timer watchdog time 60 maxrun 900
 action 100 cli command "enable"
 action 200 cli command "guestshell run bash /flash/guest-share/bootstrap.sh"
