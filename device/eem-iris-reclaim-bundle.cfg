! IRIS bundle-mode reclaim applet (REFERENCE SHAPE).
!
! BUNDLE mode has no inactive packages, so `install remove inactive` does not
! apply (and field reports show it can delete a stale packages.conf). When short
! on space the agent instead deletes UNUSED image artifacts it has vetted off-box
! (flash_target.reclaimable_artifacts): old .bin images + the leftover install
! set (.pkg/.conf/packages.conf), NEVER the running image, the image being
! staged, or IRIS's own placed copy. The agent templates one delete action per
! vetted file. authorization bypass is required on AAA nodes.
!
! Shape the agent produces (<IMG_n> = a vetted unused artifact, <FS> = target fs):
!
event manager applet IRIS-RECLAIM-BUNDLE authorization bypass
 event none maxrun 120
 action 010 cli command "enable"
 action 020 cli command "delete /force <FS><IMG_1>"
 action 030 cli command "delete /force <FS><IMG_2>"
