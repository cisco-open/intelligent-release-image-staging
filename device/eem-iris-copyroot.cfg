! IRIS native copy-to-root applet (REFERENCE SHAPE).
!
! HARDWARE-VALIDATED 2026-06-10 on C9300 17.18.03. Two findings changed the design
! from a syslog-triggered applet to this:
!   * `event syslog` did NOT fire the applet on this platform, and
!     `event manager run <applet> <arg>` did NOT populate $_arg1.
!   * EEM applets on AAA/TACACS-managed fabric nodes need `authorization bypass`
!     or their `cli command`s silently no-op.
!
! The agent TEMPLATES this applet at runtime with the filename (<IMG>) via the
! Guest Shell `cli.configure`, then fires it with `event manager run
! IRIS-COPYROOT` — see device/agent/iris_agent.py _copy_to_root_impl().
!
! TRUST BOUNDARY (fixes the C1 finding — DO NOT regress): `copy` here is a
! PLAIN copy — no `/verify`, no in-band signature check — and the applet makes
! NO success claim of its own. It logs only a NEUTRAL "ROOTCOPY-ATTEMPTED"
! breadcrumb (a syslog action fires regardless of any command's exit code, so
! an in-applet verdict can't be trusted anyway). The `delete /force` first
! clears any stale same-named leftover, so a file present afterwards can only
! be one THIS run's `copy` wrote — that's what keeps delete-first load-bearing
! even though the copy step itself no longer checks anything. The AGENT
! (iris_agent._agent_reverify_root) is the SOLE author of the verdict: it polls
! `dir flash:<IMG>` and blesses the copy only on presence AND an exact
! byte-size match against the catalog's declared size for <IMG> — see that
! function's docstring in iris_agent.py for the full contract — emitting
! "ROOTCOPY <IMG> placed at flash root ..." on success or "ROOTCOPY-FAIL <IMG>
! ..." if the file never appears or never reaches the expected size. A partial
! file left behind by a copy that died mid-transfer is caught by that size
! gate, and is cleared by the NEXT attempt's `delete /force` before it retries.
!
! Shape the agent produces (<IMG>=filename):
!
event manager applet IRIS-COPYROOT authorization bypass
 event none maxrun 900
 action 010 cli command "enable"
 action 020 cli command "delete /force flash:<IMG>"
 action 030 cli command "copy flash:/guest-share/iris/<IMG> flash:<IMG>"
 action 040 syslog msg "ROOTCOPY-ATTEMPTED <IMG>"
