! IRIS native copy-to-root applet (REFERENCE SHAPE).
!
! HARDWARE-VALIDATED 2026-06-10 on C9300 17.18.03. Two findings changed the design
! from a syslog-triggered applet to this:
!   * `event syslog` did NOT fire the applet on this platform, and
!     `event manager run <applet> <arg>` did NOT populate $_arg1.
!   * EEM applets on AAA/TACACS-managed fabric nodes need `authorization bypass`
!     or their `cli command`s silently no-op.
!
! The agent TEMPLATES this applet at runtime with the filename (<IMG>) via the
! Guest Shell `cli.configure`, then fires it with `event manager run
! IRIS-COPYROOT` — see device/agent/iris_agent.py _copy_to_root_impl().
!
! TWO-PHASE STAGE-THEN-PLACE (crash-safety fix, scrubber #82 — DO NOT regress to
! a single delete-then-copy directly onto <IMG>): <IMG> may already hold an
! older copy, nothing, or the file the BOOT variable currently points at, and
! the OLD one-phase shape deleted it before the copy could prove anything — a
! copy failure or a power loss between those two commands could leave the
! device with no image to boot. The applet now fires TWICE, redefined between
! runs under the SAME name (`no event manager applet IRIS-COPYROOT` precedes
! EACH definition below, so the second definition fully replaces the first
! rather than appending actions to it):
!
!   Phase 1 (maxrun 900) — stage and prove, never touching <IMG> itself:
!   `delete /force` any stale leftover at the RESERVED TEMP NAME <IMG>.iris-tmp
!   (IRIS's own name — never the running image or the BOOT target, so this
!   delete is always safe), then a plain `copy` from the Guest Shell scratch to
!   that same temp name.
!
!   Phase 2 (maxrun 60) — put the proven bytes in place: a single `rename` of
!   the temp name over <IMG> — a directory-entry update, not a data transfer —
!   and the ONLY command in either phase that ever touches <IMG>. This
!   reference CANNOT express the condition that actually gates it: the agent
!   only templates and fires Phase 2 after it has independently reverified
!   Phase 1's temp copy (see TRUST BOUNDARY below); a Phase 1 failure ends the
!   attempt with <IMG> completely untouched and Phase 2 never runs at all.
!   Likewise, this reference cannot express the running-image refusal that
!   gates Phase 1 itself: the agent confirms <IMG> is not the currently
!   running image before templating Phase 1, and refuses the whole attempt
!   (no IOS command runs) if that can't be confirmed.
!
! TRUST BOUNDARY (fixes the C1 finding — DO NOT regress): `copy` here is a
! PLAIN copy — no `/verify`, no in-band signature check — and NEITHER phase
! makes a success claim of its own. Each logs only a NEUTRAL breadcrumb
! ("ROOTCOPY-ATTEMPTED" after Phase 1's copy, "ROOTCOPY-PLACED" after Phase 2's
! rename — a syslog action fires regardless of any command's exit code, so an
! in-applet verdict can't be trusted anyway). The AGENT
! (iris_agent._agent_reverify_root) is the SOLE author of the verdict for BOTH
! phases — a step this reference cannot show, since it runs entirely off-box
! from this applet: after Phase 1 it polls `dir flash:<IMG>.iris-tmp`, and
! after Phase 2 it polls `dir flash:<IMG>`, blessing each only on presence AND
! an exact byte-size match against the catalog's declared size for <IMG> — see
! that function's docstring in iris_agent.py for the full contract — emitting
! "ROOTCOPY <IMG> placed at flash root ..." on final success or "ROOTCOPY-FAIL
! <IMG> ..." if either check fails. A Phase 1 copy that dies mid-transfer, or a
! Phase 1 reverify that fails outright, is caught by that size gate WITHOUT
! Phase 2 ever running, so <IMG> is never referenced and the device stays
! exactly as bootable as before the attempt. A partial file left at the temp
! name is cleared by the NEXT attempt's Phase 1 delete-first before it retries.
!
! Shape the agent produces (<IMG>=filename):
!
! Phase 1 — stage and prove:
no event manager applet IRIS-COPYROOT
event manager applet IRIS-COPYROOT authorization bypass
 event none maxrun 900
 action 010 cli command "enable"
 action 020 cli command "delete /force flash:<IMG>.iris-tmp"
 action 030 cli command "copy flash:/guest-share/iris/<IMG> flash:<IMG>.iris-tmp"
 action 040 syslog msg "ROOTCOPY-ATTEMPTED <IMG>"
!
! Phase 2 — place (fired only once the agent's reverify of Phase 1 passes):
no event manager applet IRIS-COPYROOT
event manager applet IRIS-COPYROOT authorization bypass
 event none maxrun 60
 action 010 cli command "enable"
 action 020 cli command "rename flash:<IMG>.iris-tmp flash:<IMG>"
 action 030 syslog msg "ROOTCOPY-PLACED <IMG>"
