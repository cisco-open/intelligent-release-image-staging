! IRIS native copy-to-root applet (REFERENCE SHAPE).
!
! HARDWARE-VALIDATED 2026-06-10 on C9300 17.18.03. Two findings changed the design
! from a syslog-triggered applet to this:
!   * `event syslog` did NOT fire the applet on this platform, and
!     `event manager run <applet> <arg>` did NOT populate $_arg1.
!   * EEM applets on AAA/TACACS-managed fabric nodes need `authorization bypass`
!     or their `cli command`s silently no-op.
!
! The agent TEMPLATES this applet at runtime with the filename (<IMG>) via the
! Guest Shell `cli.configure`, then fires it with `event manager run
! IRIS-COPYROOT` — see device/agent/iris_agent.py _copy_to_root_impl().
!
! THE COPY IS THE VERIFICATION:
! `copy /verify` copies the file AND enforces the Cisco signature in one
! IOS-enforced step — a bad signature fails the copy and leaves NO destination
! file ("%Error..." instead of "Digital signature successfully verified"). So
! whether a file exists at flash:<IMG> after the applet runs IS the verdict; no
! second hash, no second verify, no in-applet pass/fail judgement.
!
! TRUST BOUNDARY (fixes the C1 finding — DO NOT regress): the applet makes NO
! success claim. It logs only a NEUTRAL "ROOTCOPY-ATTEMPTED" breadcrumb (a
! syslog action fires regardless of any command's exit code, so an in-applet
! verdict can't be trusted). The `delete /force` first clears any stale
! same-named leftover, so a file present afterwards can only be one THIS run's
! `copy /verify` wrote and signature-verified. The AGENT
! (iris_agent._agent_reverify_root) then polls `dir flash:<IMG>` and is the SOLE
! author of the "ROOTCOPY <IMG> placed at flash root + verified" log (on file
! presence) or "ROOTCOPY-FAIL <IMG> ..." (if the file never appears).
!
! Shape the agent produces (<IMG>=filename):
!
event manager applet IRIS-COPYROOT authorization bypass
 event none maxrun 900
 action 010 cli command "enable"
 action 020 cli command "delete /force flash:<IMG>"
 action 030 cli command "copy /verify flash:/guest-share/iris/<IMG> flash:<IMG>"
 action 040 syslog msg "ROOTCOPY-ATTEMPTED <IMG>"
