[project]
site_name = "IRIS Documentation"
site_description = "Intelligent Release and Image Staging documentation"
site_author = "Cisco Systems, Inc."
docs_dir = "docs/zensical"
site_dir = "site"
dev_addr = "127.0.0.1:8091"
use_directory_urls = true
extra_javascript = ["javascripts/mermaid.mjs"]
copyright = "Copyright &copy; 2026 Cisco Systems, Inc."
nav = [
  { "Overview" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "AI-Guided PoC" = "aiagent.md" },
  { "Architecture" = "architecture.md" },
  { "Container Deployments" = "containers.md" },
  { "Server" = "server.md" },
  { "Network Ports and Flows" = "network-ports.md" },
  { "Management Type and VLAN Ownership" = "network-attachment.md" },
  { "Kubernetes" = "kubernetes.md" },
  { "Device Agents" = "device-agents.md" },
  { "Web Console" = "console.md" },
  { "Network Workflows" = "fleet-workflows.md" },
  { "IOx App" = "iox.md" },
  { "Security Model" = "security.md" },
  { "Observability" = "observability.md" },
  { "Operations" = "operations.md" },
  { "Validation" = "validation.md" },
  { "Development" = "development.md" },
  { "Reference" = "reference.md" },
]

[project.theme]
variant = "modern"

[project.markdown_extensions.admonition]

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
