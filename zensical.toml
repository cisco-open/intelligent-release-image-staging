[project]
site_name = "IRIS Documentation"
site_description = "Intelligent Release and Image Staging documentation"
site_author = "Cisco Systems, Inc."
site_url = "https://cisco-open.github.io/intelligent-release-image-staging/docs/"
docs_dir = "docs/zensical"
site_dir = "site"
dev_addr = "127.0.0.1:8091"
use_directory_urls = true
extra_javascript = ["javascripts/mermaid.mjs"]
copyright = "Copyright &copy; 2026 Cisco Systems, Inc."
nav = [
  { "Overview" = "index.md" },
  { "Get started" = [
    { "Getting Started" = "getting-started.md" },
    { "AI-Guided PoC" = "aiagent.md" },
  ] },
  { "How it works" = [
    { "Architecture" = "architecture.md" },
    { "Security Model" = "security.md" },
    { "Network Ports and Flows" = "network-ports.md" },
  ] },
  { "Deploy the server" = [
    { "Server" = "server.md" },
    { "Container Deployments" = "containers.md" },
    { "Docker on Separate Hosts" = "docker-hosts.md" },
    { "Kubernetes" = "kubernetes.md" },
  ] },
  { "Onboard devices" = [
    { "Device Agents" = "device-agents.md" },
    { "Management Type and VLAN Ownership" = "management-type.md" },
    { "IOx App" = "iox.md" },
  ] },
  { "Operate" = [
    { "Web Console" = "console.md" },
    { "Network Workflows" = "fleet-workflows.md" },
    { "Operations" = "operations.md" },
    { "Troubleshooting" = "troubleshooting.md" },
    { "Observability" = "observability.md" },
    { "Telemetry Export" = "telemetry-export.md" },
    { "Splunk Setup" = "splunk.md" },
    { "Dashboard Templates" = "dashboards/README.md" },
  ] },
  { "Reference and development" = [
    { "Reference" = "reference.md" },
    { "Browsable API reference" = "swagger/index.html" },
    { "API coverage and load testing" = "api-testing.md" },
    { "Problem type registry" = "problems.md" },
    { "Validation" = "validation.md" },
    { "Development" = "development.md" },
  ] },
]

[project.theme]
variant = "modern"
# Sidebar sections, a landing page per section, the breadcrumb path, the
# previous/next footer, back-to-top, anchor tracking, a table of contents that
# follows the reader, copy buttons on code blocks, linked content tabs and
# highlighted search hits. "navigation.tabs" arrives with the four guides so a
# half-migrated preview never shows a tab bar with nothing behind it.
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "content.code.copy",
  "content.tabs.link",
  "search.highlight",
]

# This table REPLACES Zensical's defaults, so every extension the manual uses
# has to be named here, including the ones that were active before.

[project.markdown_extensions.admonition]

[project.markdown_extensions.tables]

# Heading id aliases: `## New text { #old-id }` keeps a link that something
# outside the manual already points at.
[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

# Definition lists for the glossary.
[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
