name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "requirements-docs.txt"
      - "zensical.toml"
  workflow_dispatch:

# This job writes to gh-pages with `contents: write`, so the three action
# refs below are pinned to full commit SHAs, not mutable major tags
# (IRIS-13-015): a moved or compromised tag cannot run with the write token.
# Each SHA was resolved from the upstream repository's tag on 2026-09-04
# (`gh api repos/<owner>/<repo>/commits/<tag>`); the trailing comment names
# the tag it corresponds to. To update, resolve the new tag the same way.
permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-docs.txt"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build Zensical documentation
        run: zensical build

      - name: Combine website and documentation
        run: |
          mkdir -p deploy/docs
          cp docs/index.html docs/styles.css docs/app.js deploy/
          cp -R site/. deploy/docs/
          rm -f deploy/docs/404.html

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
