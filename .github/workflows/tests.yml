# Run the documented test suites (TESTING.md) on every
# pull request and on pushes to main. Everything here is what a fresh
# ubuntu runner has plus `pip install -r requirements-dev.txt` and
# `apt-get install age bats mktorrent`; no docker build, no network access
# from the tests. One prerequisite Docker build supplies the static AEAD helper.
# The `age` package carries `age-keygen`, which the real
# (unstubbed) instruction-custody tests run; without it they skip. The Python
# dependency list lives in requirements-dev.txt so a developer and this
# workflow install exactly the same thing.
#
# Known host-dependent cases (tracked on the scrubber board, not fixed here):
#   #33  device/iox/tests/test_stage_iox_package.bats "fails clearly when no
#        cert inputs are set" -- passes on a runner with no live `iris`
#        container; on the lab host it reaches the live container.
#   #74  device/tests/test_device_install.bats "non-local STAGE_HOST ...
#        demands HOST_USER" -- depends on the host's own addresses.
# Action refs are major tags for now; pin to commit SHAs once the
# maintainers have verified them (IRIS-13-015).
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/console-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/console-ui/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and check public assets
        run: npm test
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Mocked Console browser checks
        run: npm run test:browser
      - name: Read-only Swagger browser checks
        run: npm run test:swagger

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age bats mktorrent

      - name: Build native instruction AEAD helper
        run: IRIS_CRYPTO_ARCHES=amd64 bash tools/build-instruction-crypto.sh

      - name: pytest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pytest -p no:cacheprovider -q \
            server/tests/ device/agent/tests/ device/iox/tests/ device/xr/tests/ \
            lab/tests/ device/test_verify_image.py tools/test_api_exercise.py

      - name: bats
        # Report the shell suite even when pytest failed: one push should
        # surface every failure, not just the first step's. Not always(),
        # which would keep running after the concurrency group cancels a
        # superseded run.
        if: ${{ !cancelled() }}
        run: |
          bats device/test_guestshell_start.bats device/test_bootstrap.bats \
            device/tests/ device/iox/tests/ device/xr/tests/ server/tests/*.bats
