name: Prepare exact unsigned prebuilt intake

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Explicit reviewed prebuilt profile; select the exact release tag
        required: true
        type: choice
        options: [prepared-host, ubuntu-dependencies]
      draft_release_id:
        description: Pre-existing dedicated unpublished draft ID, never the final release
        required: true
        type: string
      manifest_asset_id:
        description: Exact intake manifest asset ID, uploaded after every payload
        required: true
        type: string
      manifest_sha256:
        description: Independently selected intake manifest SHA256
        required: true
        type: string
      evidence_sha256:
        description: Independently selected completed candidate evidence SHA256
        required: true
        type: string
      review_sha256:
        description: Independently approved exact source review SHA256
        required: true
        type: string
      keyring_sha256:
        description: Independently trusted Debian archive keyring SHA256
        required: true
        type: string
      pip_sdist_sha256:
        description: Independently reviewed pip source archive SHA256
        required: true
        type: string
      confirmation:
        description: "prepare prebuilt intake <tag> <manifest SHA256>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prebuilt-intake-${{ inputs.draft_release_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'cisco-open/intelligent-release-image-staging' && startsWith(github.ref, 'refs/tags/v20')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out only the tagged trusted producer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate the exact selected intake and prepare unsigned files
        env:
          PROFILE: ${{ inputs.profile }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          MANIFEST_ASSET_ID: ${{ inputs.manifest_asset_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          EVIDENCE_SHA256: ${{ inputs.evidence_sha256 }}
          REVIEW_SHA256: ${{ inputs.review_sha256 }}
          KEYRING_SHA256: ${{ inputs.keyring_sha256 }}
          PIP_SDIST_SHA256: ${{ inputs.pip_sdist_sha256 }}
          PREPARATION_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y debian-archive-keyring
          python3 tools/prebuilt-intake.py prepare --repository "$GITHUB_WORKSPACE" \
            --output-dir "$GITHUB_WORKSPACE/prebuilt-unsigned" \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --ref "$GITHUB_REF" \
            --profile "$PROFILE" --draft-release-id "$DRAFT_RELEASE_ID" \
            --manifest-asset-id "$MANIFEST_ASSET_ID" --manifest-sha256 "$MANIFEST_SHA256" \
            --evidence-sha256 "$EVIDENCE_SHA256" --review-sha256 "$REVIEW_SHA256" \
            --keyring /usr/share/keyrings/debian-archive-keyring.gpg --keyring-sha256 "$KEYRING_SHA256" \
            --pip-sdist-sha256 "$PIP_SDIST_SHA256" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --confirmation "$PREPARATION_CONFIRMATION"
      - name: Export unsigned exact bytes for separately authorized authentication
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iris-prebuilt-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: prebuilt-unsigned/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
          overwrite: false
      - name: Record the actual unsigned artifact selection
        env:
          ARTIFACT_ID: ${{ steps.unsigned.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.unsigned.outputs.artifact-digest }}
        run: |
          printf 'Unsigned prebuilt intake\nRun: %s\nAttempt: %s\nArtifact: %s\nRaw ZIP SHA256: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$ARTIFACT_SHA256" >> "$GITHUB_STEP_SUMMARY"
