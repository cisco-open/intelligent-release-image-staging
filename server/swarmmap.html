<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRIS Swarm Map</title>
<style>
:root{--bg:#0b0f17;--panel:#151c2c;--line:#33415e;--txt:#e7ecf5;--muted:#9ba7bc;--green:#46d0a0;--yellow:#ffcf4d;--red:#ff6b6b}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}.sub,#state{color:var(--muted);font-size:12px}.spacer{flex:1}button,select,input{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px}#wrap{position:relative;min-height:calc(100vh - 84px)}svg{width:100%;height:min(68vh,720px);display:block}.edge{stroke:#768195;stroke-width:1.4;opacity:.65}.edge.measured{stroke:var(--green);stroke-width:2.5;stroke-dasharray:5 7;animation:flow .9s linear infinite}.node{cursor:pointer}.node:focus{outline:none}.node:focus circle{stroke:white;stroke-width:3}.label{fill:var(--txt);font-size:11px;text-anchor:middle}.small{fill:var(--muted);font-size:10px;text-anchor:middle}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.edge.measured{animation:none}.pulse{animation:none}}.legend{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}.legend b{color:var(--txt)}#empty{position:absolute;inset:0 0 auto;top:150px;text-align:center;color:var(--muted)}#peertable{width:100%;border-collapse:collapse;margin:0;padding:12px}#peertable th,#peertable td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}#peertable button{width:100%;text-align:left;border:0;background:transparent}#drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100vw);padding:18px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .2s}#drawer.open{transform:translateX(0)}#drawer h2{margin-top:0}#drawer h3{border-bottom:1px solid var(--line);padding-bottom:5px;font-size:14px}dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px}dt{color:var(--muted)}dd{text-align:right;margin:0}.warn{color:var(--yellow)}.bad{color:var(--red)}
</style></head><body>
<header><div><h1>IRIS Swarm Map</h1><div class="sub">Live tracker participation and explicitly sourced observations</div></div><div class="spacer"></div><select id="imgsel" aria-label="Image filter"></select><input id="peerfind" type="search" placeholder="Find device, model, or IP"><select id="attention" aria-label="Attention filter"><option value="">All states</option><option value="attention">Needs attention</option></select><button id="pause">Pause</button><span id="state">Initial loading…</span></header>
<main id="wrap"><svg id="svg" viewBox="0 0 1000 650" aria-label="Swarm topology"></svg><div id="empty" hidden></div><div class="legend"><span><b>Gray spoke</b> = tracker participation/layout only; not a measured transfer path.</span><span><b style="color:var(--green)">Green arrow</b> = fresh measured server → peer send rate.</span></div><table id="peertable"><caption>Current filtered tracker participants</caption><thead><tr><th>Participant</th><th>Tracker role</th><th>Status</th></tr></thead><tbody></tbody></table></main><aside id="drawer" aria-label="Participant details"></aside>
<script>
const SVGNS="http://www.w3.org/2000/svg"; window.IRIS_MAP_CFG = null;
const MAP=window.IRIS_MAP_CFG||{swarmUrl:"/swarm",pull:false}; let CSRF=null;
if(MAP.pull)fetch("/api/session").then(r=>r.ok?r.json():null).then(x=>CSRF=x&&x.csrf).catch(()=>{});
const svg=document.getElementById("svg"),drawer=document.getElementById("drawer"),empty=document.getElementById("empty"),state=document.getElementById("state");
let DATA=null,curHash="all",query="",attention="",paused=false,timer=null,inflight=null,generation=0,backoff=5,lastUpdated=0,lastFocus=null,selected=null,drawerGen=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const e=(tag,a={},p)=>{const x=document.createElementNS(SVGNS,tag);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(p)p.append(x);return x};
const fmt=n=>n==null?"—":Number(n)<1024?Math.round(n)+" B":(Number(n)/1024/1024).toFixed(1)+" MB"; const rate=n=>n==null?"—":fmt(n)+"/s";
const age=(when)=>when==null?"—":Math.max(0,Math.round((DATA?.now??Date.now()/1000)-when))+"s ago";
function peerName(p){return p.tracker?.participant_class==="legacy_unattributed"?"Legacy unattributed peer":(p.device_id||"Unknown participant")}
function peerStatus(p){const d=p.device_observation,o=p.peer_enforcement,policy=p.peer_policy;let a=[];if(p.tracker?.participant_class==="legacy_unattributed")a.push("legacy unattributed");if(!p.device_id&&p.tracker?.participant_class!=="legacy_unattributed")a.push("unknown identity");if(d)a.push(d.stale?"device observation stale":(d.obs_state||"device observation fresh"));else a.push("device observation unavailable");if(policy?.quarantined)a.push("policy intent quarantined");if(o){a.push("enforcement "+(o.state||"unknown"));if(o.blocked===true)a.push("blocked");if(o.conflict)a.push("conflict")};return a.join(" · ")}
function allPeers(){let out=[];(DATA?.images||[]).forEach(im=>(im.peers||[]).forEach(p=>out.push({...p,_img:im.image,_hash:im.info_hash,_total:im.total_bytes})));return out.filter(p=>curHash==="all"||p._hash===curHash).filter(p=>{let s=(peerName(p)+" "+(p.ip||"")+" "+(p.model||"")+" "+peerStatus(p)).toLowerCase();return !query||s.includes(query)}).filter(p=>attention!=="attention"||/stale|unavailable|paused|disabled|not_active|quarantined|pending|degraded|rpc_unavailable|fail_closed|conflict|blocked|legacy|unknown/.test(peerStatus(p)))}
function sync(){let sel=document.getElementById("imgsel"),imgs=DATA?.images||[],key=imgs.map(x=>x.info_hash).join("|");if(sel.dataset.key!==key){sel.dataset.key=key;sel.replaceChildren(new Option("All images","all"),...imgs.map(x=>new Option(x.image,x.info_hash)))}if(!imgs.some(x=>x.info_hash===curHash))curHash="all";sel.value=curHash}
function server(){return DATA?.server||{}} function obs(){return server().server_observation||{}} function freshServerPeer(p){let x=p.server_observation?.peer;return x&&Number(x.send_bps)>0&&x.observed_at!=null&&((DATA?.now??Date.now()/1000)-x.observed_at<=120)?x:null}
function render(){sync();let peers=allPeers(),W=1000,H=650,cx=500,cy=300;svg.replaceChildren();let defs=e("defs",{},svg),marker=e("marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto"},defs);e("path",{d:"M0,0 L10,5 L0,10z",fill:"#46d0a0"},marker);let host=server().host||"origin server";let hub=e("g",{class:"node",role:"button",tabindex:"0","aria-label":"Open origin server observations"},svg);e("circle",{cx,cy,r:34,fill:"#302815",stroke:"#ffcf4d"},hub);e("text",{x:cx,y:cy+5,class:"label"},hub).textContent="ORIGIN";e("text",{x:cx,y:cy+52,class:"small"},hub).textContent=host;activate(hub,openHub);
 peers.forEach((p,i)=>{let a=-Math.PI/2+i*2*Math.PI/Math.max(peers.length,1),x=cx+210*Math.cos(a),y=cy+210*Math.sin(a),measured=freshServerPeer(p);e("line",{x1:cx,y1:cy,x2:x,y2:y,class:measured?"edge measured":"edge",...(measured?{"marker-end":"url(#arrow)"}:{})},svg);if(measured){let t=e("text",{x:(cx+x)/2,y:(cy+y)/2,class:"small",fill:"#46d0a0"},svg);t.textContent=rate(measured.send_bps)}let g=e("g",{class:"node",role:"button",tabindex:"0","aria-label":"Open "+peerName(p)+" details"},svg);e("circle",{cx:x,cy:y,r:25,fill:"#14213a",stroke:p.tracker?.role==="seeder"?"#ffcf4d":"#4ea1ff"},g);e("text",{x,y:y+4,class:"label"},g).textContent=p.tracker?.role==="seeder"?"SEED":"DL";e("text",{x,y:y+43,class:"small"},g).textContent=peerName(p);activate(g,()=>openPeer(p));});
 empty.hidden=peers.length>0;empty.textContent=!DATA?"Initial loading…":(query||attention||curHash!=="all"?"No participants match the current filter.":"No active tracker participants.");let tbody=document.querySelector("#peertable tbody");tbody.replaceChildren();peers.forEach(p=>{let tr=document.createElement("tr"),b=document.createElement("button");b.textContent=peerName(p)+(p.tracker?.participant_class==="legacy_unattributed"?" — "+(p.ip||""):"");b.addEventListener("click",()=>openPeer(p));let td=document.createElement("td");td.append(b);tr.append(td,Object.assign(document.createElement("td"),{textContent:p.tracker?.role||"unknown"}),Object.assign(document.createElement("td"),{textContent:peerStatus(p)}));tbody.append(tr)});updateState()}
function activate(node,fn){node.addEventListener("click",fn);node.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();fn()}})}
function section(title,body){return `<h3>${title}</h3><dl>${body}</dl>`}function row(k,v){return `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`}
function openPeer(p){lastFocus=document.activeElement;selected=p;let tr=p.tracker||{},so=p.server_observation?.peer,d=p.device_observation,r=p.latest_report,policy=p.peer_policy,en=p.peer_enforcement;let ident=p.tracker?.participant_class==="legacy_unattributed"?`Legacy unattributed peer · ${esc(p.ip)}<p class="warn">Warning: no per-device quarantine is available; identity is not inferred from IP.</p>`:esc(peerName(p));drawer.innerHTML=`<button id="close">Close</button><h2>${ident}</h2>${section("Tracker",row("Principal",tr.principal_type||"unknown")+row("Participant class",tr.participant_class||"unknown")+row("Role",tr.role||"unknown")+row("Progress",tr.progress==null?"—":Math.round(tr.progress*100)+"%")+row("Left",fmt(tr.left))+row("Last seen",age(tr.last_seen)))}${section("Server observation",so?row("Measured server → peer",rate(so.send_bps))+row("Observed",age(so.observed_at))+row("Source","server RPC peer observation"):row("Status","unavailable"))}${section("Device observation",d?row("State",d.obs_state||"observed")+row("Age",d.age_s==null?"—":d.age_s+"s")+row("Source time",age(d.observed_at||d.observed_received_at))+row("Receive rate",rate(d.receive_bps))+row("Content at end",fmt(d.completed_content_bytes)):row("Status","unavailable"))}${section("Latest report",r?row("Schema",r.schema||"unknown")+row("Event",r.event||"—")+row("Content verification",r.content_sha256_state||"—")+row("IOS copy verification",r.ios_copy_verify_state||"—")+row("Received",age(r.received_at)):row("Status","unavailable"))}${section("Policy intent",policy?row("Decision",policy.decision||"—")+row("Quarantined",policy.quarantined===true?"yes":"no")+row("Fail closed",policy.fail_closed===true?"yes":"no"):row("Status","unavailable"))}${section("Enforcement",en?row("State",en.state||"unknown")+row("Blocked",en.blocked===true?"yes":"not directly reported")+row("Conflict",en.conflict?"reported":"none reported"):row("Status","unavailable"))}${MAP.pull&&p.device_id?'<button id="pullbtn">Pull fresh data from device</button>':""}<div id="repbox"></div>`;drawer.classList.add("open");drawer.querySelector("#close").addEventListener("click",closeDrawer);let b=document.getElementById("pullbtn");if(b)b.addEventListener("click",()=>requestPull(p.device_id));renderHistorical(p)}
function renderHistorical(p){let rows=(p.latest_report?.peers||[]).map(x=>`<tr><td>Historical participation / observed by this device</td><td>${esc(x.ip||x)}</td></tr>`).join("");if(rows)document.getElementById("repbox").innerHTML=`<h3>Historical participation</h3><table><tbody>${rows}</tbody></table>`}
function openHub(){lastFocus=document.activeElement;let o=obs(),g=o.global||{},ts=o.torrent||[];drawer.innerHTML=`<button id="close">Close</button><h2>${esc(server().host||"Origin server")}</h2>${section("Server observation",row("RPC",o.rpc_up?"up":"unavailable")+row("Observed",age(o.observed_at))+row("Upload rate",rate(g.upload_bps))+row("Download rate",rate(g.download_bps))+row("Connections",g.connections)+row("Active torrents",g.active_torrents))}<h3>Per-torrent control state</h3>${ts.map(t=>`<p>${esc(t.image||t.info_hash)}: ${esc(fmt(t.upload_length_bytes))} uploadLength <span class="warn">control-state payload; may exceed image size</span></p>`).join("")||"<p>None</p>"}`;drawer.classList.add("open");drawer.querySelector("#close").addEventListener("click",closeDrawer)}
function closeDrawer(){drawer.classList.remove("open");if(lastFocus)lastFocus.focus()}
async function requestPull(id){if(!id)return;let r=await fetch("/api/devices/"+encodeURIComponent(id)+"/request-report",{method:"POST",headers:{"X-CSRF-Token":CSRF||""}});if(!r.ok)throw Error("pull failed")}
function updateState(){let suffix=lastUpdated?" Updated "+Math.max(0,Math.round(Date.now()/1000-lastUpdated))+"s ago":"";state.textContent=paused?"Paused."+suffix:(DATA?(obs().rpc_up===false?"RPC unavailable; tracker peers may remain."+suffix:"Live."+suffix):"Unavailable/retrying in "+backoff+"s.")}
async function poll(){if(paused||document.hidden)return;let my=++generation;inflight=new AbortController();try{let r=await fetch(MAP.swarmUrl,{cache:"no-store",signal:inflight.signal});if(!r.ok)throw Error("HTTP "+r.status);let data=await r.json();if(my!==generation)return;DATA=data;backoff=5;lastUpdated=Date.now()/1000;render()}catch(err){if(err.name!=="AbortError"){DATA=null;backoff=Math.min(30,backoff*2);render()}}finally{inflight=null;schedule()}}
function schedule(){clearTimeout(timer);if(!paused&&!document.hidden)timer=setTimeout(poll,backoff*1000)}
document.getElementById("imgsel").onchange=e=>{curHash=e.target.value;render()};document.getElementById("peerfind").oninput=e=>{query=e.target.value.toLowerCase();render()};document.getElementById("attention").onchange=e=>{attention=e.target.value;render()};document.getElementById("pause").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause";updateState();if(!paused)schedule()};document.addEventListener("visibilitychange",()=>{if(document.hidden){if(inflight)inflight.abort();clearTimeout(timer)}else if(!paused)poll()});window.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer.classList.contains("open"))closeDrawer()});render();poll();
</script></body></html>
