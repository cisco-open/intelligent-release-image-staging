<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRIS Swarm Map</title>
<style>
:root{--bg:#0b0f17;--panel:#151c2c;--line:#33415e;--txt:#e7ecf5;--muted:#9ba7bc;--green:#46d0a0;--yellow:#ffcf4d}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0}.sub,#state{color:var(--muted);font-size:12px}.spacer{flex:1}button,select,input{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px}#wrap{position:relative;min-height:calc(100vh - 84px)}svg{width:100%;height:min(68vh,720px);display:block}.edge{stroke:#768195;stroke-width:1.4;opacity:.65}.edge.measured{stroke:var(--green);stroke-width:2.5;stroke-dasharray:5 7;animation:flow .9s linear infinite}.node{cursor:pointer}.node:focus{outline:none}.node:focus circle{stroke:#fff;stroke-width:3}.label{fill:var(--txt);font-size:11px;text-anchor:middle}.small{fill:var(--muted);font-size:10px;text-anchor:middle}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.edge.measured{animation:none}}.legend{padding:9px 14px;border-top:1px solid var(--line);color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}.legend b{color:var(--txt)}#empty{position:absolute;inset:0 0 auto;top:150px;text-align:center;color:var(--muted)}#peertable{width:100%;border-collapse:collapse;padding:12px}#peertable th,#peertable td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}#peertable button{width:100%;text-align:left;border:0;background:transparent}#drawer{position:fixed;inset:0 0 0 auto;width:min(560px,100vw);padding:18px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:2}#drawer.open{transform:translateX(0)}#drawer h2{margin-top:0}#drawer h3{border-bottom:1px solid var(--line);padding-bottom:5px;font-size:14px}dl{display:grid;grid-template-columns:minmax(130px,45%) 1fr;gap:6px;margin:0}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}.warn{color:var(--yellow)}
</style></head><body>
<header><div><h1>IRIS Swarm Map</h1><div class="sub">Live tracker participation and explicitly sourced observations</div></div><div class="spacer"></div><select id="imgsel" aria-label="Image filter"></select><input id="peerfind" type="search" placeholder="Find device, model, or IP"><select id="attention" aria-label="Attention filter"><option value="">All states</option><option value="attention">Needs attention</option></select><button id="pause">Pause</button><span id="state" role="status" aria-live="polite">Initial loading…</span></header>
<main id="wrap"><svg id="svg" viewBox="0 0 1000 650" aria-label="Swarm topology"></svg><div id="empty" role="status" aria-live="polite" hidden></div><div class="legend"><span><b>Gray spoke</b> = tracker participation/layout only; not a measured transfer path.</span><span><b style="color:var(--green)">Green arrow</b> = fresh measured server → peer send rate.</span></div><table id="peertable"><caption>Current filtered tracker participants</caption><thead><tr><th>Participant</th><th>Tracker role</th><th>Status</th></tr></thead><tbody></tbody></table></main><aside id="drawer" role="dialog" aria-modal="true" aria-label="Participant details" aria-hidden="true"></aside>
<script>
const SVGNS="http://www.w3.org/2000/svg"; window.IRIS_MAP_CFG = null;
const MAP=window.IRIS_MAP_CFG||{swarmUrl:"/swarm",pull:false}; const DENSE_LABEL_THRESHOLD=40,MEASURED_RATE_FRESH_S=120,POLL_SECONDS=5;let CSRF=null;
if(MAP.pull)fetch("/api/session").then(r=>r.ok?r.json():null).then(x=>CSRF=x&&x.csrf).catch(()=>{});
const svg=document.getElementById("svg"),drawer=document.getElementById("drawer"),empty=document.getElementById("empty"),state=document.getElementById("state"),wrap=document.getElementById("wrap");let DATA=null,curHash="all",query="",attention="",paused=false,timer=null,inflight=null,generation=0,backoff=POLL_SECONDS,lastUpdated=0,lastFocus=null,selected=null,drawerGen=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const e=(tag,a={},p)=>{let x=document.createElementNS(SVGNS,tag);Object.entries(a).forEach(([k,v])=>x.setAttribute(k,v));if(p)p.append(x);return x};const fmt=n=>n==null?"—":Number(n)<1024?Math.round(n)+" B":(Number(n)/1024/1024).toFixed(1)+" MB",rate=n=>n==null?"—":fmt(n)+"/s",age=when=>when==null?"—":Math.max(0,Math.round((DATA?.now??Date.now()/1000)-when))+"s ago";
function peerName(p){return p.tracker?.participant_class==="legacy_unattributed"?"Legacy unattributed peer":(p.device_id||"Unknown participant")}function peerStatus(p){let d=p.device_observation,o=p.peer_enforcement,a=[];if(p.tracker?.participant_class==="legacy_unattributed")a.push("legacy unattributed");if(d)a.push(d.stale?"device observation stale":(d.obs_state||"device observation fresh"));else a.push("device observation unavailable");if(p.peer_policy?.quarantined)a.push("policy intent quarantined");if(o)a.push("enforcement "+(o.state||"unknown"));return a.join(" · ")}
function allPeers(){let out=[];(DATA?.images||[]).forEach(im=>(im.peers||[]).forEach(p=>out.push({...p,_img:im.image,_hash:im.info_hash})));return out.filter(p=>curHash==="all"||p._hash===curHash).filter(p=>!query||(peerName(p)+" "+(p.ip||"")+" "+(p.model||"")+peerStatus(p)).toLowerCase().includes(query)).filter(p=>attention!=="attention"||/stale|unavailable|quarantined|legacy/.test(peerStatus(p)))}function sync(){let sel=document.getElementById("imgsel"),imgs=DATA?.images||[],key=imgs.map(x=>x.info_hash).join("|");if(sel.dataset.key!==key){sel.dataset.key=key;sel.replaceChildren(new Option("All images","all"),...imgs.map(x=>new Option(x.image,x.info_hash)))}if(!imgs.some(x=>x.info_hash===curHash))curHash="all";sel.value=curHash}function server(){return DATA?.server||{}}function obs(){return server().server_observation||{}}
function freshServerPeer(p){let x=p.server_observation?.peer,observed=x?.observed_at??obs().observed_at;/* Fallback is valid only because current producer emits peer rates with this server poll; it must not survive a decoupled producer. */return x&&Number(x.send_bps)>0&&observed!=null&&((DATA?.now??Date.now()/1000)-observed<=MEASURED_RATE_FRESH_S)?{...x,observed_at:observed}:null}function position(i,n,cx,cy){let ring=Math.floor(Math.sqrt(i/8)),start=ring*ring*8,slots=Math.max(8,(ring*2+1)*8),angle=-Math.PI/2+(i-start)*2*Math.PI/slots,r=150+ring*95;return{x:cx+r*Math.cos(angle),y:cy+r*Math.sin(angle)}}
function render(){sync();let peers=allPeers(),cx=500,cy=300,dense=peers.length>DENSE_LABEL_THRESHOLD;svg.replaceChildren();let defs=e("defs",{},svg),marker=e("marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto"},defs);e("path",{d:"M0,0 L10,5 L0,10z",fill:"#46d0a0"},marker);let hub=e("g",{class:"node",role:"button",tabindex:"0","aria-label":"Open origin server observations"},svg);e("circle",{cx,cy,r:34,fill:"#302815",stroke:"#ffcf4d"},hub);e("text",{x:cx,y:cy+5,class:"label"},hub).textContent="ORIGIN";activate(hub,openHub);peers.forEach((p,i)=>{let q=position(i,peers.length,cx,cy),measured=freshServerPeer(p);e("line",{x1:cx,y1:cy,x2:q.x,y2:q.y,class:measured?"edge measured":"edge",...(measured?{"marker-end":"url(#arrow)"}:{})},svg);if(measured&&!dense){let t=e("text",{x:(cx+q.x)/2,y:(cy+q.y)/2,class:"small",fill:"#46d0a0"},svg);t.textContent=rate(measured.send_bps)}let g=e("g",{class:"node",role:"button",tabindex:"0","aria-label":"Open "+peerName(p)+" details"},svg);e("circle",{cx:q.x,cy:q.y,r:25,fill:"#14213a",stroke:p.tracker?.role==="seeder"?"#ffcf4d":"#4ea1ff"},g);e("text",{x:q.x,y:q.y+4,class:"label"},g).textContent=p.tracker?.role==="seeder"?"SEED":"DL";if(!dense){e("text",{x:q.x,y:q.y+43,class:"small"},g).textContent=peerName(p)}activate(g,()=>openPeer(p))});empty.hidden=peers.length>0;empty.textContent=!DATA?"Initial loading…":(query||attention||curHash!=="all"?"No participants match the current filter.":"No active tracker participants.");let tbody=document.querySelector("#peertable tbody");tbody.replaceChildren();peers.forEach(p=>{let tr=document.createElement("tr"),b=document.createElement("button");b.textContent=peerName(p)+(p.ip?" — "+p.ip:"");b.addEventListener("click",()=>openPeer(p));let td=document.createElement("td");td.append(b);tr.append(td,Object.assign(document.createElement("td"),{textContent:p.tracker?.role||"unknown"}),Object.assign(document.createElement("td"),{textContent:peerStatus(p)}));tbody.append(tr)});updateState()}
function activate(node,fn){node.addEventListener("click",fn);node.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();fn()}})}function section(title,body){return `<h3>${title}</h3><dl>${body}</dl>`}function row(k,v){return `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`}function openDrawer(html){lastFocus=document.activeElement;drawer.innerHTML=html;drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");wrap.setAttribute("aria-hidden","true");let close=drawer.querySelector("#close");close.addEventListener("click",closeDrawer);close.focus()}function closeDrawer(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");wrap.removeAttribute("aria-hidden");if(lastFocus)lastFocus.focus()}
function reportRows(reports){let r=reports[reports.length-1],rows=(r?.peers||[]).map(x=>`<tr><td>Historical participation / observed by this device</td><td>${esc(typeof x==="object"?(x.ip||"unknown participant"):x)}</td></tr>`).join("");return r?section("Historical participation",rows?`<table><tbody>${rows}</tbody></table>`:"No participant rows in this report.")+`<p class="sub">${esc(r.schema||"v1")} report; participation only, not bytes or transfer direction.</p>`:""}async function refreshDrawerReport(p,my){try{let r=await fetch("/api/devices/"+encodeURIComponent(p.device_id)+"/reports");let b=r.ok?await r.json():{reports:[]};if(my===drawerGen&&selected===p){let box=document.getElementById("repbox");if(box)box.innerHTML=reportRows(b.reports||[])||"No full report received yet."}}catch(_){if(my===drawerGen)document.getElementById("repbox").textContent="Historical participation unavailable."}}
function openPeer(p){selected=p;let tr=p.tracker||{},so=p.server_observation?.peer,d=p.device_observation,r=p.latest_report,ident=p.tracker?.participant_class==="legacy_unattributed"?`Legacy unattributed peer · ${esc(p.ip||"unknown IP")}<p class="warn">Warning: no per-device quarantine is available; identity is not inferred from IP.</p>`:esc(peerName(p));openDrawer(`<button id="close">Close</button><h2>${ident}</h2>${p.ip?`<p class="sub">Announce IP: ${esc(p.ip)}</p>`:""}${section("Tracker",row("Role",tr.role||"unknown")+row("Last seen",age(tr.last_seen)))}${section("Server observation",so?row("Measured server → peer",rate(so.send_bps))+row("Observed",age(so.observed_at??obs().observed_at)):row("Status","unavailable"))}${section("Device observation",d?row("State",d.obs_state||"observed")+row("Receive rate",rate(d.receive_bps)):row("Status","unavailable"))}${section("Latest report",r?row("Schema",r.schema||"v1")+row("Event",r.event||"—")+row("Received",age(r.received_at)):row("Status","unavailable"))}${MAP.pull&&p.device_id?'<button id="pullbtn">Pull fresh data from device</button><p id="pullstatus" role="status" aria-live="polite"></p><div id="repbox"></div>':'<p class="sub">No device identity; fresh report pull is unavailable.</p>'}`);let my=++drawerGen;if(MAP.pull&&p.device_id){refreshDrawerReport(p,my);document.getElementById("pullbtn").addEventListener("click",()=>requestPull(p,my))}}
function openHub(){let o=obs(),g=o.global||{};openDrawer(`<button id="close">Close</button><h2>${esc(server().host||"Origin server")}</h2>${section("Server observation",row("RPC",o.rpc_up?"up":"unavailable")+row("Observed",age(o.observed_at))+row("Upload rate",rate(g.send_bps))+row("Download rate",rate(g.receive_bps))+row("Connections",g.connections))}`)}async function requestPull(p,my){let b=document.getElementById("pullbtn"),s=document.getElementById("pullstatus");b.disabled=true;s.textContent="Request pending…";let requested=Date.now()/1000;try{let r=await fetch("/api/devices/"+encodeURIComponent(p.device_id)+"/request-report",{method:"POST",headers:{"X-CSRF-Token":CSRF||""}}),body=await r.json().catch(()=>({}));if(r.status===429){s.textContent="A report request is already pending.";return}if(!r.ok)throw Error(body.error||r.status);let until=Date.now()+30000;while(Date.now()<until&&my===drawerGen){await new Promise(x=>setTimeout(x,2000));let rr=await fetch("/api/devices/"+encodeURIComponent(p.device_id)+"/reports"),out=rr.ok?await rr.json():{reports:[]};if(my!==drawerGen)return;document.getElementById("repbox").innerHTML=reportRows(out.reports||[])||"No full report received yet.";let latest=(out.reports||[]).at(-1);if(latest&&Number(latest.received_at)>=requested){s.textContent="Fresh report received by server.";return}}s.textContent="Still waiting for a matching report; refresh later."}catch(_){s.textContent="Pull failed; retry later."}finally{if(my===drawerGen)b.disabled=false}}
function updateState(){let suffix=lastUpdated?" Updated "+Math.max(0,Math.round(Date.now()/1000-lastUpdated))+"s ago":"";state.textContent=paused?"Paused."+suffix:(DATA?(obs().rpc_up===false?"RPC unavailable; tracker peers may remain."+suffix:"Live."+suffix):"Unavailable/retrying in "+backoff+"s.")}async function poll(){if(paused||document.hidden)return;let my=++generation;inflight=new AbortController();try{let r=await fetch(MAP.swarmUrl,{cache:"no-store",signal:inflight.signal});if(!r.ok)throw Error("HTTP "+r.status);let data=await r.json();if(my!==generation)return;DATA=data;backoff=POLL_SECONDS;lastUpdated=Date.now()/1000;render()}catch(err){if(err.name!=="AbortError"){DATA=null;backoff=Math.min(30,backoff*2);render()}}finally{inflight=null;schedule()}}function schedule(){clearTimeout(timer);if(!paused&&!document.hidden)timer=setTimeout(poll,backoff*1000)}
document.getElementById("imgsel").addEventListener("change",x=>{curHash=x.target.value;render()});document.getElementById("peerfind").addEventListener("input",x=>{query=x.target.value.toLowerCase();render()});document.getElementById("attention").addEventListener("change",x=>{attention=x.target.value;render()});document.getElementById("pause").addEventListener("click",x=>{paused=!paused;x.target.textContent=paused?"Resume":"Pause";updateState();if(!paused)poll()});document.addEventListener("visibilitychange",()=>{if(document.hidden){if(inflight)inflight.abort();clearTimeout(timer)}else if(!paused)poll()});window.addEventListener("message",e=>{if(e.origin!==location.origin)return;if(e.data==="MAP_PAUSE"){paused=true;if(inflight)inflight.abort();clearTimeout(timer);updateState()}if(e.data==="MAP_RESUME"){paused=false;poll()}});drawer.addEventListener("keydown",e=>{if(e.key!=="Tab")return;let f=[...drawer.querySelectorAll('button,[href],input,select,[tabindex]:not([tabindex="-1"])')],a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}});window.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer.classList.contains("open"))closeDrawer()});render();poll();
</script></body></html>
