# IRIS coordination and seed server.
#   docker compose -f server/docker-compose.yml run --rm iris iris-bootstrap
#   docker compose -f server/docker-compose.yml up -d --build
#
# IRIS_HOST_IP is ALWAYS the machine running docker (the devices must be able to
# reach it). It is baked into the catalog's self-signed TLS certificate, which is
# generated on first start — if you change it later, delete the config volume so
# the cert regenerates.
#
# Publish an image (run inside the container; IRIS_IMAGE_ROOT is mounted at
# /opt/images). Runtime secret paths are declared in the container environment,
# so docker compose exec can use iris-publish without repeating them.
#
# NON-ROOT: the container runs as the fixed uid/gid 10001 (image user `iris`).
# Two host-side paths cross the container boundary and must be made accessible
# to that uid ON EVERY DEPLOY (fresh or upgraded) — the Dockerfile cannot chown
# the host:
#   sudo chown 10001 "$IRIS_AGE_KEY_FILE_HOST"            # keep it mode 600
#   sudo chown -R 10001:10001 artifacts                   # from the REPO ROOT
# (the IRIS_ARTIFACTS_HOST_DIR default below is ../artifacts because Compose
# resolves it relative to THIS file's directory, server/ — pasting that literal
# into a repo-root shell would target a directory above the repository.)
# A deployment UPGRADED from a root-runtime release additionally needs a
# one-time migration of the named volumes (a fresh volume inherits the image's
# 10001 ownership automatically; existing ones stay root-owned). Run it as a
# THROWAWAY container, not through this service: `compose run` inherits the
# cap_drop below, so the chown is denied even as --user 0 — and `chown -R` still
# exits 0, so the failure looks like success. Volume names carry the compose
# project prefix (`iris_` from the `name:` below; `server_` on a deployment
# created before that line existed — see the migration note there):
#   docker run --rm -u 0 \
#     -v server_iris-state:/var/lib/iris \
#     -v server_iris-config:/etc/iris \
#     -v server_iris-images:/var/lib/iris-images \
#     iris:latest chown -R 10001:10001 /var/lib/iris /etc/iris /var/lib/iris-images
# This applies per volume, so a RESET that removes some volumes but KEEPS others
# still needs it for the ones kept — e.g. wiping iris-config/iris-state to redo
# admin setup while preserving iris-images leaves the published .bin files
# root-owned mode 0600, and the non-root server cannot read them (the Images
# screen then lists them as "not readable by the server").

# COMPOSE PROJECT NAME — declared, never derived. Without this line Compose
# names the project after this file's parent directory, which is always
# "server", so a second checkout of this repository on a host that already runs
# IRIS resolves to the SAME project and the SAME named volumes as the live
# deployment: `up` adopts the production container, `run --rm iris
# iris-bootstrap` re-bootstraps production state, and `down -v` deletes it.
#
# The value is deliberately "server", the same name the directory used to
# derive, so declaring it changes NOTHING for an existing deployment: the
# volumes it already has (`server_iris-state` and friends) stay exactly where
# they are and no migration is needed. What the line buys is that the name is
# now a fact of this file rather than an accident of where it was checked out,
# so it can no longer change under a rename or a second clone.
#
# COMPOSE_PROJECT_NAME (and `-p`) still override this, which is how you run a
# dev stack beside a live one — set IRIS_CONTAINER too, since container names
# are host-global. See docs/zensical/server.md -> "Compose project name".
name: server
services:
  iris:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        # Bake the release version into the image (console Settings page).
        # OPTIONAL: set it at build time, e.g.
        #   IRIS_VERSION="$(cat VERSION)" docker compose -f server/docker-compose.yml up -d --build
        # or add IRIS_VERSION=<version> to server/.env. When unset, the console
        # reads the VERSION file baked into the image.
        # Deliberately NOT mirrored under `environment:` — a runtime entry
        # would override the baked value with "" whenever the var is unset
        # at `up` time (e.g. a restart), losing the version.
        IRIS_VERSION: "${IRIS_VERSION:-}"
    image: iris:latest
    # Container names are host-global, so this is overridable for the same
    # reason the project name is. IRIS_CONTAINER is the variable the rest of
    # tools/ already honours, so one setting names the container and points the
    # helpers at it.
    container_name: "${IRIS_CONTAINER:-iris}"
    init: true
    # The image already declares USER iris (uid 10001); restated here so
    # `docker compose run`/`exec` and any future image override can't silently
    # regress to root.
    user: "10001:10001"
    # No service needs Linux capabilities (every listener binds >1024, no raw
    # sockets, no chown at runtime) and nothing may re-gain privilege via
    # setuid/file caps.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      # the docker host's IP, used in the TLS cert SAN — REQUIRED, no default
      IRIS_HOST_IP: "${IRIS_HOST_IP:?Set IRIS_HOST_IP to this server's IP, e.g. IRIS_HOST_IP=10.0.0.5 docker compose up}"
      # External observability is OPT-IN. The swarm map lives in the Console
      # (:8080 -> Swarm tab; the old :9101/swarmmap now serves a pointer page);
      # the Prometheus-format /metrics endpoint + OTLP push only turn on when
      # IRIS_OBSERVABILITY=1.
      # Use this if you already run an OpenTelemetry collector and backend
      # (e.g., Splunk); leave unset otherwise.
      IRIS_OBSERVABILITY: "${IRIS_OBSERVABILITY:-}"
      # When observability is on, point at your OTel collector's OTLP/HTTP
      # endpoint, e.g. IRIS_OTLP_ENDPOINT=http://<collector-ip>:4318. Inert
      # unless IRIS_OBSERVABILITY=1.
      IRIS_OTLP_ENDPOINT: "${IRIS_OTLP_ENDPOINT:-}"
      # Seeder/telemetry poll cadence in seconds (default 15). On a fast
      # link a whole image can transfer inside one interval -- a 1 GB image at
      # ~90 MB/s lands in ~15s -- and the poll then observes no connected peer
      # at all, so per-peer rates and the swarm map's measured edges never
      # appear. Lower it (2-5s) on fast fabrics or for a live demo; the cost is
      # more aria2 RPC calls.
      IRIS_SAMPLE_INTERVAL: "${IRIS_SAMPLE_INTERVAL:-}"
      # Overrides the :9101 pointer page's console link verbatim (e.g. on a
      # shared host publishing the console on a non-default port). Unset ->
      # the moved_page() default of https://<IRIS_HOST_IP>:8080/.
      IRIS_CONSOLE_URL: "${IRIS_CONSOLE_URL:-}"
      # The published console host port, so the Settings page can show the real
      # one (the container always listens on 8080 internally).
      IRIS_GUI_PUBLISH: "${IRIS_GUI_PUBLISH:-}"
      # Device/stage-host SSH trust (lab/iris-ssh-policy.sh): host keys are
      # recorded on first contact under /var/lib/iris/ssh/known_hosts (the
      # persistent state volume) and must match afterwards. Legacy SHA-1 KEX /
      # ssh-rsa / CBC algorithms that old IOS-XE images need are opt-in.
      IRIS_SSH_LEGACY: "${IRIS_SSH_LEGACY:-0}"
      # Routed Guest Shell installs: `isis` adds `ip router isis` to the IRIS
      # SVI (fabrics such as an SD-Access underlay must learn the IRIS
      # subnet); the default `none` injects nothing into the operator's IGP.
      # Fleet-wide default until the deployment record carries it per device.
      SVI_IGP: "${SVI_IGP:-none}"
      # ---- Optional deployment knobs documented in the reference ----
      # Compose injects ONLY what this block names: exporting a variable in the
      # shell or listing it in server/.env does nothing unless it appears here.
      # Every one of these is documented in docs/zensical/reference.md, so each
      # is passed through. Where an EMPTY value would not mean the same thing as
      # "unset" to the reader on the other side, the code's own default is
      # restated as the fallback rather than the empty string.
      IRIS_HTTP_TIMEOUT: "${IRIS_HTTP_TIMEOUT:-}"
      # int() with no guard in tracker.py, and an empty value would build
      # "http://<host>:/announce" in the catalog -- restate the default.
      # Changing it needs the 6969 port mapping below changed to match.
      IRIS_TRACKER_PORT: "${IRIS_TRACKER_PORT:-6969}"
      IRIS_TRACKER_ANNOUNCE: "${IRIS_TRACKER_ANNOUNCE:-}"
      IRIS_REQUIRE_IDENTITY_GATE: "${IRIS_REQUIRE_IDENTITY_GATE:-}"
      IRIS_ENDPOINT_TTL: "${IRIS_ENDPOINT_TTL:-}"
      IRIS_GUI_ALLOW_PLAINTEXT: "${IRIS_GUI_ALLOW_PLAINTEXT:-}"
      IRIS_CATALOG_ALLOW_PLAINTEXT: "${IRIS_CATALOG_ALLOW_PLAINTEXT:-}"
      IRIS_ARTIFACTS_ALLOW_PLAINTEXT: "${IRIS_ARTIFACTS_ALLOW_PLAINTEXT:-}"
      IRIS_HEALTH_LISTENERS: "${IRIS_HEALTH_LISTENERS:-}"
      IRIS_AUDIT_RETENTION_DAYS: "${IRIS_AUDIT_RETENTION_DAYS:-}"
      IRIS_AUDIT_MAX_EVENTS: "${IRIS_AUDIT_MAX_EVENTS:-}"
      # int() with no guard on the other side -- an empty string would raise and
      # the console would never start, so the code default is restated here.
      IRIS_ONBOARD_CONCURRENCY: "${IRIS_ONBOARD_CONCURRENCY:-25}"
      IRIS_ENROLL_TTL: "${IRIS_ENROLL_TTL:-3600}"
      IRIS_ONBOARD_JOB_TIMEOUT: "${IRIS_ONBOARD_JOB_TIMEOUT:-}"
      IRIS_ONBOARD_REAP_GRACE: "${IRIS_ONBOARD_REAP_GRACE:-}"
      # Seeder announce-token overlap (secrets_store.SEEDER_PREV_TTL). One
      # value for every process: the deadline is computed from it, not stored.
      IRIS_SEEDER_PREV_TTL: "${IRIS_SEEDER_PREV_TTL:-}"
      IRIS_XR_SESSION_TIMEOUT: "${IRIS_XR_SESSION_TIMEOUT:-}"
      IRIS_DEVICE_ENABLE_ALWAYS: "${IRIS_DEVICE_ENABLE_ALWAYS:-}"
      # Device/stage-host SSH host identity (lab/iris-ssh-policy.sh): pin one
      # key, point at a known_hosts file, or leave both unset for the default
      # record-on-first-contact under $IRIS_STATE/ssh.
      IRIS_SSH_HOST_KEY: "${IRIS_SSH_HOST_KEY:-}"
      IRIS_SSH_KNOWN_HOSTS: "${IRIS_SSH_KNOWN_HOSTS:-}"
      # Seeder concurrency (server/seed-launch.sh).
      SEED_MAX_CONCURRENT: "${SEED_MAX_CONCURRENT:-1000}"
      # Telemetry listener + swarm surface. An empty IRIS_METRICS_PORT DISABLES
      # the listener and an empty IRIS_SWARM_URL breaks the console's swarm
      # proxy, so both restate the code default.
      IRIS_METRICS_PORT: "${IRIS_METRICS_PORT:-9101}"
      IRIS_METRICS_HOST: "${IRIS_METRICS_HOST:-0.0.0.0}"
      IRIS_SWARM_URL: "${IRIS_SWARM_URL:-http://127.0.0.1:9101/swarm}"
      IRIS_SWARM_PUBLIC: "${IRIS_SWARM_PUBLIC:-}"
      # OTLP collector authentication. Values are secrets: prefer the _FILE
      # form with a Docker secret over putting the header in server/.env.
      IRIS_OTLP_HEADERS: "${IRIS_OTLP_HEADERS:-}"
      IRIS_OTLP_HEADERS_FILE: "${IRIS_OTLP_HEADERS_FILE:-}"
      IRIS_OTLP_DEVICE_METRICS: "${IRIS_OTLP_DEVICE_METRICS:-}"
      IRIS_EVENTS_URL_TEMPLATE: "${IRIS_EVENTS_URL_TEMPLATE:-}"
      # At-rest encryption (age). The master identity is mounted as a Docker
      # secret (read-only, RAM-backed); plaintext is decrypted to a tmpfs at
      # /run/iris and never touches the persistent iris-config volume.
      IRIS_AGE_KEY_FILE: "/run/secrets/iris_age_key"
      # Comma-separated age PUBLIC keys: primary + an offline break-glass
      # recipient so a lost primary key doesn't make the store unrecoverable.
      # Adding a recipient later: `iris-bootstrap --rekey` re-encrypts the
      # existing state to this list (never --force, which mints new secrets).
      IRIS_AGE_RECIPIENTS: "${IRIS_AGE_RECIPIENTS:?Set IRIS_AGE_RECIPIENTS to primary,break-glass age public keys}"
      # Declare every persistent/runtime path in the container environment so
      # one-shot commands launched with `docker compose exec` see the same paths
      # as the supervised services.
      IRIS_STATE: "/var/lib/iris"
      IRIS_CONFIG: "/etc/iris"
      IRIS_RUN: "/run/iris"
      IRIS_SECRETS: "/run/iris/secrets.json"
      IRIS_RPC_SECRET_FILE: "/run/iris/rpc-secret"
      IRIS_CERT: "/run/iris/tls/cert.pem"
      IRIS_SECRETS_ENC: "/etc/iris/secrets.json.age"
      IRIS_AUDIT: "/etc/iris/audit.jsonl"
      IRIS_IMAGES_DIR: "/var/lib/iris-images"
      IRIS_ARTIFACTS_DIR: "/srv/artifacts"
      IMAGES_ROOT: "/opt/images"
      IMAGES_DIR: "/opt/images/iosxe/c9300"
    ports:
      - "6969:6969"     # tracker (http)
      - "8443:8443"     # catalog (https)
      - "8000:8000"     # artifact server (agent bundle + per-device configs)
      - "6881:6881"     # seeder's BitTorrent data port (peers fetch pieces here)
      - "9101:9101"     # telemetry: Prometheus /metrics + /healthz (scrape target)
      # published side overridable — shared hosts may already have :8080 taken
      # (e.g. Jenkins); the container always listens on 8080 internally.
      - "${IRIS_GUI_PUBLISH:-8080}:8080"     # web console (https)
      # NOTE: the seeder's aria2 RPC (:6800) is intentionally NOT published — it
      # binds localhost-only inside the container (spec §5). Publish images with
      # `docker compose exec` (see header), which reaches it on 127.0.0.1:6800.
    volumes:
      - iris-state:/var/lib/iris
      - iris-config:/etc/iris
      - "${IRIS_IMAGE_ROOT:-/opt/images}:/opt/images:ro"
      # artifacts the devices download during install (agent bundle, bootstrap,
      # pinned cert, per-device configs). READ-WRITE: the container
      # self-provisions the derivable served files at startup
      # (docker-entrypoint.sh -> provision-served.sh: rebuilds iris-agent.tgz
      # from the image-baked device sources, copies bootstrap.sh, and refreshes
      # iris-catalog.pem from the server cert) so a fresh deploy doesn't fail
      # onboarding on an empty artifacts/. The container writes only content it
      # generates itself. The operator-built iris-arm64.tar, iris-amd64.tar, and
      # iris-xr.rpm packages are served but never modified. Per-device staging configs
      # (gui_onboard.py, IRIS_STAGE_LOCAL=1) live under staging/ and are swept
      # after STAGING_MAX_AGE_SECONDS. This dir is gitignored — not tracked
      # source — so self-provisioning it is expected.
      - "${IRIS_ARTIFACTS_HOST_DIR:-../artifacts}:/srv/artifacts"
      - iris-images:/var/lib/iris-images
      # Cisco-licensed console typeface (Sharp Sans Bold). .dockerignore keeps
      # it OUT of the build context and every image layer -- Cisco's license
      # does not permit redistributing it inside the image (or the release
      # tarball; tools/make-release.sh's allowlist excludes it too) -- so the
      # console falls back to its default font stack (font-display: swap,
      # server/webroot/styles.css) without it. A deployment that
      # INDEPENDENTLY holds the Sharp Sans license restores it at RUNTIME,
      # never inside the image, by pointing IRIS_SHARP_SANS_FONT_HOST at the
      # .woff2 file on the Compose host:
      #   IRIS_SHARP_SANS_FONT_HOST=/path/to/SharpSans-Bold.woff2 \
      #     docker compose -f server/docker-compose.yml up -d
      # Left unset, this mounts /dev/null (present on every Linux host) --
      # a harmless, always-present no-op every other deployment never has to
      # think about: the console reads an empty file, the browser rejects it
      # as an invalid font and falls back exactly as it does when the path
      # is absent altogether.
      - "${IRIS_SHARP_SANS_FONT_HOST:-/dev/null}:/opt/iris/server/webroot/fonts/SharpSans-Bold.woff2:ro"
    # plaintext secrets live ONLY here, in RAM — never on the iris-config
    # volume. The mount options make the tmpfs owned by the non-root runtime
    # uid and private to it — without them docker mounts it root:root and the
    # entrypoint (uid 10001) could not restrict it. uid=/gid= tmpfs options
    # need Docker Engine 23.0+.
    tmpfs:
      - /run/iris:uid=10001,gid=10001,mode=0700
    secrets:
      - iris_age_key
    # survives crashes AND host/docker restarts (only a manual `docker stop` sticks)
    restart: unless-stopped
    # log rotation: everything (tracker/catalog/seeder) goes to stdout; docker keeps
    # at most 3 x 10 MB files per container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  iris-state:
  iris-config:
  iris-images:
secrets:
  iris_age_key:
    # path on the docker host to the age IDENTITY (private key) file, umask 077.
    # NEVER committed; NEVER on the encrypted volume.
    file: "${IRIS_AGE_KEY_FILE_HOST:?Set IRIS_AGE_KEY_FILE_HOST to the host path of the age identity}"
