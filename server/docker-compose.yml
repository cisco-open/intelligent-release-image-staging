# IRIS coordination and seed server.
#   docker compose -f server/docker-compose.yml run --rm iris iris-bootstrap
#   docker compose -f server/docker-compose.yml up -d --build
#
# IRIS_HOST_IP is ALWAYS the machine running docker (the devices must be able to
# reach it). It is baked into the catalog's self-signed TLS certificate, which is
# generated on first start — if you change it later, delete the config volume so
# the cert regenerates.
#
# Publish an image (run inside the container; IRIS_IMAGE_ROOT is mounted at
# /opt/images). Runtime secret paths are declared in the container environment,
# so docker compose exec can use iris-publish without repeating them.
services:
  iris:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        # Bake the release version into the image (console Settings page).
        # OPTIONAL: set it at build time, e.g.
        #   IRIS_VERSION="$(cat VERSION)" docker compose -f server/docker-compose.yml up -d --build
        # or add IRIS_VERSION=<version> to server/.env. When unset, the console
        # reads the VERSION file baked into the image.
        # Deliberately NOT mirrored under `environment:` — a runtime entry
        # would override the baked value with "" whenever the var is unset
        # at `up` time (e.g. a restart), losing the version.
        IRIS_VERSION: "${IRIS_VERSION:-}"
    image: iris:latest
    container_name: iris
    init: true
    environment:
      # the docker host's IP, used in the TLS cert SAN — REQUIRED, no default
      IRIS_HOST_IP: "${IRIS_HOST_IP:?Set IRIS_HOST_IP to this server's IP, e.g. IRIS_HOST_IP=10.0.0.5 docker compose up}"
      # External observability is OPT-IN. The swarm map on :9101/swarmmap is
      # always served from inside the container; the Prometheus /metrics
      # endpoint + OTLP/Loki push only turn on when IRIS_OBSERVABILITY=1.
      # Use this if you already run a Grafana/Prometheus/Loki/OTel stack;
      # leave unset otherwise.
      IRIS_OBSERVABILITY: "${IRIS_OBSERVABILITY:-}"
      # When observability is on, point at your OTel collector's OTLP/HTTP
      # endpoint, e.g. IRIS_OTLP_ENDPOINT=http://<collector-ip>:4318. Inert
      # unless IRIS_OBSERVABILITY=1.
      IRIS_OTLP_ENDPOINT: "${IRIS_OTLP_ENDPOINT:-}"
      # Overrides the :9101 pointer page's console link verbatim (e.g. on a
      # shared host publishing the console on a non-default port). Unset ->
      # the moved_page() default of https://<IRIS_HOST_IP>:8080/.
      IRIS_CONSOLE_URL: "${IRIS_CONSOLE_URL:-}"
      # The published console host port, so the Settings page can show the real
      # one (the container always listens on 8080 internally).
      IRIS_GUI_PUBLISH: "${IRIS_GUI_PUBLISH:-}"
      # At-rest encryption (age). The master identity is mounted as a Docker
      # secret (read-only, RAM-backed); plaintext is decrypted to a tmpfs at
      # /run/iris and never touches the persistent iris-config volume.
      IRIS_AGE_KEY_FILE: "/run/secrets/iris_age_key"
      # Comma-separated age PUBLIC keys: primary + an offline break-glass
      # recipient so a lost primary key doesn't make the store unrecoverable.
      IRIS_AGE_RECIPIENTS: "${IRIS_AGE_RECIPIENTS:?Set IRIS_AGE_RECIPIENTS to primary,break-glass age public keys}"
      # Declare every persistent/runtime path in the container environment so
      # one-shot commands launched with `docker compose exec` see the same paths
      # as the supervised services.
      IRIS_STATE: "/var/lib/iris"
      IRIS_CONFIG: "/etc/iris"
      IRIS_RUN: "/run/iris"
      IRIS_SECRETS: "/run/iris/secrets.json"
      IRIS_RPC_SECRET_FILE: "/run/iris/rpc-secret"
      IRIS_CERT: "/run/iris/tls/cert.pem"
      IRIS_SECRETS_ENC: "/etc/iris/secrets.json.age"
      IRIS_AUDIT: "/etc/iris/audit.jsonl"
      IRIS_IMAGES_DIR: "/var/lib/iris-images"
      IRIS_ARTIFACTS_DIR: "/srv/artifacts"
      IMAGES_ROOT: "/opt/images"
      IMAGES_DIR: "/opt/images/iosxe/c9300"
    ports:
      - "6969:6969"     # tracker (http)
      - "8443:8443"     # catalog (https)
      - "8000:8000"     # artifact server (agent bundle + per-device configs)
      - "6881:6881"     # seeder's BitTorrent data port (peers fetch pieces here)
      - "9101:9101"     # telemetry: Prometheus /metrics + /healthz (scrape target)
      # published side overridable — shared hosts may already have :8080 taken
      # (e.g. Jenkins); the container always listens on 8080 internally.
      - "${IRIS_GUI_PUBLISH:-8080}:8080"     # web console (https)
      # NOTE: the seeder's aria2 RPC (:6800) is intentionally NOT published — it
      # binds localhost-only inside the container (spec §5). Publish images with
      # `docker compose exec` (see header), which reaches it on 127.0.0.1:6800.
    volumes:
      - iris-state:/var/lib/iris
      - iris-config:/etc/iris
      - "${IRIS_IMAGE_ROOT:-/opt/images}:/opt/images:ro"
      # artifacts the devices download during install (agent bundle, bootstrap,
      # pinned cert, per-device configs). READ-WRITE: the container
      # self-provisions the derivable served files at startup
      # (docker-entrypoint.sh -> provision-served.sh: rebuilds iris-agent.tgz
      # from the image-baked device sources, copies bootstrap.sh, and refreshes
      # iris-catalog.pem from the server cert) so a fresh deploy doesn't fail
      # onboarding on an empty artifacts/. The container writes only content it
      # generates itself; the sole operator-supplied file is iris-arm64.tar (the IOx
      # agent), which the container never modifies. Per-device staging configs
      # (gui_onboard.py, IRIS_STAGE_LOCAL=1) live under staging/ and are swept
      # after STAGING_MAX_AGE_SECONDS. This dir is gitignored — not tracked
      # source — so self-provisioning it is expected.
      - "${IRIS_ARTIFACTS_HOST_DIR:-../artifacts}:/srv/artifacts"
      - iris-images:/var/lib/iris-images
    # plaintext secrets live ONLY here, in RAM — never on the iris-config volume
    tmpfs:
      - /run/iris
    secrets:
      - iris_age_key
    # survives crashes AND host/docker restarts (only a manual `docker stop` sticks)
    restart: unless-stopped
    # log rotation: everything (tracker/catalog/seeder) goes to stdout; docker keeps
    # at most 3 x 10 MB files per container
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  iris-state:
  iris-config:
  iris-images:
secrets:
  iris_age_key:
    # path on the docker host to the age IDENTITY (private key) file, umask 077.
    # NEVER committed; NEVER on the encrypted volume.
    file: "${IRIS_AGE_KEY_FILE_HOST:?Set IRIS_AGE_KEY_FILE_HOST to the host path of the age identity}"
